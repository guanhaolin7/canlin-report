  <style>
    :root {
      --purple: #4B19D8;

      --card: #FFFFFF;
      --text: #151121;
      --muted: #6F6A7E;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(247,248,252,.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(75,25,216,.15);
    }
    .topbar-inner {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 10px 12px 8px;
    }
    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      color: var(--deep-purple);
      font-weight: 800;
    }
    .brand-row .date {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
    }
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex: 0 0 auto;
      min-width: 42px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      color: var(--deep-purple);
      background: white;
      border: 1px solid rgba(75,25,216,.22);
      text-decoration: none;
      font-weight: 800;
      font-size: 13px;
    }
    .tab:hover, .tab:focus-visible {
      background: var(--deep-purple);
      color: white;
      outline: none;
    }
    main {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 18px 12px 28px;
    }
    .report-page {
      scroll-margin-top: 96px;
      margin: 0 auto 18px;
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .report-page img {
      display: block;
      width: 100%;
      max-width: 980px;
      height: auto;
      object-fit: contain;
      border-radius: 14px;
      box-shadow: 0 10px 34px rgba(36,16,95,.10);
      background: white;
    }
    footer {
      width: min(980px, calc(100% - 24px));
      margin: 0 auto 34px;
      background: white;
      border-radius: 16px;
      padding: 18px 20px;
      border-left: 6px solid var(--neon);
      box-shadow: 0 8px 28px rgba(36,16,95,.08);
      color: #403A4E;
      line-height: 1.7;
      font-size: 14px;
    }
    footer strong {
      display: block;
      color: var(--deep-purple);
      margin-bottom: 4px;
    }
    .back-top {
      position: fixed;
      right: 16px;
      bottom: 16px;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: var(--deep-purple);
      color: var(--neon);
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(36,16,95,.25);
    }
    @media (max-width: 600px) {
      .topbar-inner { padding-inline: 10px; }
      main { padding: 12px 8px 22px; }
      .report-page { margin-bottom: 12px; }
      .report-page img { border-radius: 10px; }
      .brand-row .brand { font-size: 14px; }
