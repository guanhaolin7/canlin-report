<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>股貨宅CanLin｜2026/07/07 戰略情報簡報</title>
  <meta name="description" content="股貨宅CanLin 2026/07/07 科技財經圖卡簡報，含股貨宅觀點與期靈王夜盤觀點。">
  <style>
    :root {
      --purple: #24105f;
      --purple-2: #3a138a;
      --green: #8cff00;
      --ink: #111;
      --muted: #626676;
      --paper: #f7f8fc;
      --line: #deddeb;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(140, 255, 0, .13), transparent 30rem),
        linear-gradient(180deg, #fff 0%, var(--paper) 30rem);
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid rgba(36, 16, 95, .14);
      background: rgba(255, 255, 255, .92);
      backdrop-filter: blur(14px);
    }

    .bar {
      width: min(1120px, calc(100% - 28px));
      margin: 0 auto;
      padding: 14px 0 12px;
      display: grid;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      color: var(--purple);
      font-weight: 900;
      letter-spacing: 0;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-size: clamp(18px, 4vw, 28px);
      white-space: nowrap;
    }

    .brand-mark {
      width: 14px;
      height: 34px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--green), var(--purple));
      flex: 0 0 auto;
    }

    .date {
      font-size: clamp(14px, 3vw, 18px);
      color: var(--muted);
      white-space: nowrap;
    }

    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar { display: none; }

    .tabs a {
      flex: 0 0 auto;
      padding: 8px 13px;
      border: 1px solid rgba(36, 16, 95, .22);
      border-radius: 999px;
      color: var(--purple);
      background: #fff;
      text-decoration: none;
      font-weight: 850;
      font-size: 14px;
      line-height: 1;
    }

    .tabs a:hover,
    .tabs a:focus {
      background: var(--purple);
      color: #fff;
      outline: none;
    }

    main {
      width: min(1120px, calc(100% - 28px));
      margin: 24px auto 56px;
    }

    .hero {
      margin: 0 0 22px;
      padding: 18px 18px 16px;
      border: 1px solid var(--line);
      border-left: 8px solid var(--green);
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 12px 34px rgba(36, 16, 95, .08);
    }

    .hero h1 {
      margin: 0 0 8px;
      color: var(--purple);
      font-size: clamp(26px, 6vw, 46px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .hero p {
      margin: 0;
      color: #2d2d34;
      font-size: clamp(15px, 3.6vw, 19px);
      line-height: 1.65;
      font-weight: 650;
    }

    .deck {
      display: grid;
      gap: 28px;
    }

    .page {
      scroll-margin-top: 112px;
      margin: 0;
    }

    .page img {
      display: block;
      width: min(100%, 760px);
      height: auto;
      margin: 0 auto;
      border-radius: 10px;
      border: 1px solid rgba(36, 16, 95, .16);
      box-shadow: 0 16px 46px rgba(36, 16, 95, .14);
      background: #fff;
    }

    .page figcaption {
      width: min(100%, 760px);
      margin: 9px auto 0;
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    .disclaimer {
      margin: 34px auto 0;
      width: min(100%, 760px);
      padding: 18px 18px 18px 20px;
      border: 1px solid var(--line);
      border-left: 8px solid var(--green);
      border-radius: 12px;
      background: #fff;
      color: #24242b;
      font-size: 15px;
      line-height: 1.7;
      font-weight: 650;
    }

    .footer {
      padding: 26px 14px 36px;
      text-align: center;
      color: #fff;
      background: linear-gradient(90deg, var(--purple), var(--purple-2));
      font-weight: 850;
    }

    .footer span { color: var(--green); }

    @media (max-width: 640px) {
      .bar { width: min(100% - 20px, 1120px); }
      main { width: min(100% - 16px, 1120px); margin-top: 14px; }
      .brand { align-items: flex-start; }
      .brand-title { font-size: 18px; }
      .hero { padding: 15px 14px; }
      .deck { gap: 18px; }
      .page img { border-radius: 7px; }
      .tabs a { padding: 8px 11px; }
    }
  </style>
</head>
<body>

    <div class="bar">
      <div class="brand">
        <div class="brand-title"><span class="brand-mark"></span>股貨宅CanLin｜戰略情報簡報</div>
        <div class="date">2026/07/07</div>
      </div>
      <nav class="tabs" aria-label="頁面導覽">

        <a href="#page03">03</a>
        <a href="#page04">04</a>

  <main>

      <p>本套圖卡整合股貨宅觀點，並將期靈王夜盤圖卡列為第 10 頁。現貨與期貨分開呈現，核心聚焦：韓股熔斷、外資提款、關卡修復、族群輪動與隔日檢查表。</p>

      <figure class="page" id="page02">

      </figure>
      <figure class="page" id="page04">

      <figure class="page" id="page07">

        <figcaption>07/10 三條接棒路線，等跌出價差</figcaption>
      </figure>
      <figure class="page" id="page08">

      <figure class="page" id="page09">

        <figcaption>09/10 明日不是猜漲跌，而是驗證四個訊號</figcaption>
      </figure>
      <figure class="page" id="page10">
        <img src="assets/page10.png" alt="10 期靈王31 Plus 台指期夜盤">
        <figcaption>10/10 期靈王31 Plus 台指期夜盤</figcaption>
      </figure>
    </section>

    <section class="disclaimer">
      本簡報內容僅供研究與資訊整理參考，不構成任何投資建議。投資人應獨立判斷，審慎評估並自負風險。
    </section>
  </main>

  <footer class="footer">
    股貨宅CanLin｜<span>持強、分批、等確認</span>
  </footer>
</body>
</html>
