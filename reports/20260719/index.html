<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#24105f">
  <meta name="description" content="股貨宅 CanLin｜2026/07/20～2026/07/31 台股戰略情報簡報">
  <title>股貨宅 CanLin｜戰略情報簡報</title>
  <style>
    :root {
      --bg: #f7f8fc;
      --card: #ffffff;
      --purple: #4b19d8;
      --deep-purple: #24105f;
      --green: #9dff2e;
      --ink: #171323;
      --muted: #6e6781;
      --line: rgba(75, 25, 216, .14);
      --shadow: 0 14px 34px rgba(36, 16, 95, .13);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 92px; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 0%, rgba(75, 25, 216, .08), transparent 30rem),
        var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
                   "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(247, 248, 252, .94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 8px 22px rgba(36, 16, 95, .07);
    }

    .topbar-inner {
      max-width: 980px;
      margin: 0 auto;
      padding: 12px 14px 10px;
    }

    .brand-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 10px;
    }

    .brand {
      min-width: 0;
      font-weight: 900;
      letter-spacing: .01em;
      color: var(--deep-purple);
      font-size: clamp(16px, 3.6vw, 23px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .date {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .page-nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 1px 1px 3px;
      scrollbar-width: none;
      overscroll-behavior-inline: contain;
    }

    .page-nav::-webkit-scrollbar { display: none; }

    .page-tab {
      flex: 0 0 auto;
      min-width: 45px;
      text-align: center;
      text-decoration: none;
      color: var(--deep-purple);
      background: #fff;
      border: 1px solid rgba(75, 25, 216, .20);
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 900;
      line-height: 1;
      box-shadow: 0 3px 10px rgba(36, 16, 95, .06);
    }

    .page-tab:hover,
    .page-tab:focus-visible,
    .page-tab.active {
      color: var(--deep-purple);
      background: var(--green);
      border-color: var(--green);
      outline: none;
    }

    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 14px 10px;
    }

    .report-card {
      margin: 0 0 28px;
      scroll-margin-top: 94px;
      background: var(--card);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid rgba(75, 25, 216, .10);
    }

    .report-card img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 3 / 4;
      object-fit: contain;
      background: #fff;
    }

    figcaption {
      padding: 12px 16px 14px;
      color: var(--deep-purple);
      background: #fff;
      border-top: 1px solid var(--line);
      font-size: 14px;
      font-weight: 800;
    }

    footer {
      max-width: 980px;
      margin: 0 auto;
      padding: 0 14px 36px;
    }

    .disclaimer {
      position: relative;
      overflow: hidden;
      background: #fff;
      border-radius: 18px;
      padding: 20px 22px 20px 28px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(75, 25, 216, .10);
      color: #514a61;
      font-size: 14px;
      line-height: 1.8;
    }

    .disclaimer::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 7px;
      background: var(--green);
    }

    .disclaimer strong {
      display: block;
      color: var(--deep-purple);
      margin-bottom: 4px;
      font-size: 16px;
    }

    .back-top {
      display: inline-block;
      margin-top: 14px;
      color: var(--purple);
      font-weight: 800;
      text-decoration: none;
    }

    @media (max-width: 640px) {
      html { scroll-padding-top: 86px; }
      .topbar-inner { padding-inline: 10px; }
      .date { display: none; }
      main { padding: 18px 8px 8px; }
      .report-card {
        margin-bottom: 18px;
        border-radius: 14px;
        box-shadow: 0 10px 24px rgba(36, 16, 95, .12);
      }
      figcaption { font-size: 12px; padding: 10px 12px 12px; }
      footer { padding-inline: 8px; }
      .disclaimer { border-radius: 14px; padding: 17px 17px 17px 23px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>

  <script>
    (() => {
      const tabs = [...document.querySelectorAll('.page-tab')];
      const cards = [...document.querySelectorAll('.report-card')];

      const setActive = (id) => {
        tabs.forEach(tab => {
          const active = tab.getAttribute('href') === '#' + id;
          tab.classList.toggle('active', active);
          if (active) tab.scrollIntoView({inline: 'center', block: 'nearest'});
        });
      };

      const observer = new IntersectionObserver((entries) => {
        const visible = entries
          .filter(entry => entry.isIntersecting)
          .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
        if (visible) setActive(visible.target.id);
      }, {
        rootMargin: '-18% 0px -62% 0px',
        threshold: [0.05, 0.25, 0.5]
      });

      cards.forEach(card => observer.observe(card));
      setActive('page01');
    })();
  </script>
