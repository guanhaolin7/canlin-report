<!doctype html>

  <style>
    :root {

      --green: #7cff00;
      --ink: #111111;
      --line: #e6e4ef;
      --bg: #f6f7fb;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 4px 18px rgba(27,7,90,.08);
    }
    .topbar {
      max-width: 980px;
      margin: 0 auto;
      padding: 12px 16px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      font-weight: 900;
      color: var(--purple);
      letter-spacing: .02em;
      font-size: clamp(16px, 3.8vw, 24px);
      white-space: nowrap;
    }
    .date {
      color: var(--purple);
      font-weight: 800;
      border: 2px solid var(--purple);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 14px;
      white-space: nowrap;
    }
    nav {
      max-width: 980px;
      margin: 0 auto;
      padding: 0 16px 12px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    nav::-webkit-scrollbar { display: none; }
    .tab {
      flex: 0 0 auto;
      min-width: 44px;
      text-align: center;
      text-decoration: none;
      color: #fff;
      background: var(--purple);
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 900;
      line-height: 1;
    }
    .tab:hover { background: var(--purple-2); color: var(--green); }
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 18px 12px 36px;
    }
    .card-page {
      margin: 0 auto 24px;
      scroll-margin-top: 112px;
    }
    .page-label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 8px;
      color: var(--purple);
      font-weight: 900;
      font-size: 15px;
    }
    .page-label span {
      background: var(--purple);
      color: var(--green);
      border-radius: 999px;
      padding: 5px 10px;
      min-width: 62px;
      text-align: center;
    }
    .card-page img {
      display: block;
      width: 100%;
      max-width: 720px;
      aspect-ratio: 3 / 4;
      height: auto;
      margin: 0 auto;
      border-radius: 10px;
      box-shadow: 0 14px 40px rgba(27,7,90,.16);
      background: #fff;
    }
    .notice {
      max-width: 720px;
      margin: 8px auto 0;
      background: #fff;
      border: 1px solid var(--line);
      border-left: 6px solid var(--green);
      border-radius: 10px;
      padding: 14px 16px;
      color: #333;
      font-size: 14px;
      line-height: 1.7;
    }
    @media (max-width: 640px) {
      .topbar { align-items: flex-start; }
      .date { font-size: 12px; padding: 5px 8px; }
      main { padding: 14px 8px 28px; }
      .card-page { margin-bottom: 18px; }
      .card-page img { border-radius: 6px; box-shadow: 0 10px 26px rgba(27,7,90,.14); }
    }
  </style>
</head>
