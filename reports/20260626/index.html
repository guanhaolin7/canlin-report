<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>股貨宅CanLin｜2026.06.26 戰略情報簡報</title>
  <meta name="description" content="2026.06.26 台股盤後戰略情報簡報，含資金流、期貨觀點、族群接棒與明日驗證清單。">
  <style>
    :root {
      --bg: #f6f3ff;
      --panel: #ffffff;
      --purple: #24105f;
      --green: #8df23a;
      --text: #160f2f;
      --muted: #6b6380;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 20% 0%, rgba(141, 242, 58, 0.18), transparent 30%),
        linear-gradient(180deg, #fbfaff 0%, var(--bg) 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid rgba(36, 16, 95, 0.14);
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(14px);
    }
    .bar {
      max-width: 1120px;
      margin: 0 auto;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      font-weight: 900;
      letter-spacing: 0.02em;
      color: var(--purple);
    }
    .date {
      color: var(--muted);
      font-weight: 700;
      white-space: nowrap;
    }
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 24px 14px 48px;
    }
    .hero {
      margin: 0 0 22px;
      padding: 18px;
      border: 1px solid rgba(36, 16, 95, 0.14);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.82);
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(26px, 4vw, 42px);
      line-height: 1.12;
      color: var(--purple);
    }
    .hero p {
      margin: 0;
      color: var(--muted);
      font-weight: 700;
      line-height: 1.55;
    }
    .pages {
      display: grid;
      gap: 22px;
    }
    figure {
      margin: 0;
      padding: 10px;
      border: 1px solid rgba(36, 16, 95, 0.14);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 10px 30px rgba(36, 16, 95, 0.10);
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 6px;
      background: #fff;
    }
    figcaption {
      padding: 10px 4px 2px;
      font-size: 14px;
      color: var(--muted);
      font-weight: 700;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--purple);
      color: #fff;
      font-weight: 900;
    }
    .tag span {
      color: var(--green);
    }
    footer {
      max-width: 980px;
      margin: 0 auto;
      padding: 0 14px 28px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <div class="brand">股貨宅CanLin｜戰略情報簡報</div>
      <div class="date">2026.06.26</div>
    </div>
  </header>
  <main>
    <section class="hero">
      <h1>月線失守，IC基板獨撐</h1>
      <p>10 頁固定版：前 9 頁為研究圖卡，第 10 頁附上期靈王 31 Plus 台指期夜盤原圖。</p>
      <div class="tag">GitHub Pages <span>deploy-ready</span></div>
    </section>
    <section class="pages">
      <figure>
        <img src="assets/page01.jpg" alt="page01 月線失守 IC基板獨撐">
        <figcaption>page01｜封面與資金戰場</figcaption>
      </figure>
      <figure>
        <img src="assets/page02.jpg" alt="page02 TLDR 三句話定盤">
        <figcaption>page02｜TL;DR 與事件雷達</figcaption>
      </figure>
      <figure>
        <img src="assets/page03.jpg" alt="page03 現貨結構 月線失守後的防守圖">
        <figcaption>page03｜現貨結構</figcaption>
      </figure>
      <figure>
        <img src="assets/page04.jpg" alt="page04 籌碼壓力 現貨大賣期貨未追空">
        <figcaption>page04｜籌碼壓力</figcaption>
      </figure>
      <figure>
        <img src="assets/page05.jpg" alt="page05 期靈王期貨觀點 路徑只看原文">
        <figcaption>page05｜期靈王期貨觀點</figcaption>
      </figure>
      <figure>
        <img src="assets/page06.jpg" alt="page06 資金流全圖 主幹撤退口袋收斂">
        <figcaption>page06｜資金流全圖</figcaption>
      </figure>
      <figure>
        <img src="assets/page07.jpg" alt="page07 接棒族群 只剩兩個口袋">
        <figcaption>page07｜接棒族群</figcaption>
      </figure>
      <figure>
        <img src="assets/page08.jpg" alt="page08 三套劇本 下週決定反彈品質">
        <figcaption>page08｜三套劇本</figcaption>
      </figure>
      <figure>
        <img src="assets/page09.jpg" alt="page09 明日驗證清單 四個開關決定方向">
        <figcaption>page09｜明日驗證清單</figcaption>
      </figure>
      <figure>
        <img src="assets/page10.jpg" alt="page10 期靈王31 Plus 台指期夜盤附圖">
        <figcaption>page10｜期靈王 31 Plus 台指期夜盤附圖</figcaption>
      </figure>
    </section>
  </main>
  <footer>
    本頁為固定頁序輸出，圖片引用已寫死為 assets/page01.jpg 至 assets/page10.jpg。
  </footer>
</body>
</html>
